<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice</title>
    <style>
        @media print {
            @page { size: A4; margin: 10mm; }
            .no-print { display: none !important; }
            body { background: white !important; }
        }
        body {
            font-family: Arial, sans-serif;
            color: #222;
            margin: 0;
            padding: 20px;
            background: #f3f4f6;
        }
        .page {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 24px;
            border-radius: 10px;
            box-shadow: 0 6px 24px rgba(0,0,0,0.08);
        }
        .controls {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-bottom: 16px;
        }
        .btn {
            border: 1px solid #ddd;
            background: #fff;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn.primary {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
        }
        .header {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 16px;
        }
        .store {
            max-width: 60%;
        }
        .store h1 {
            margin: 0 0 6px 0;
            font-size: 20px;
        }
        .store p {
            margin: 2px 0;
            font-size: 13px;
        }
        .invoice-meta {
            text-align: right;
        }
        .invoice-meta h2 {
            margin: 0 0 6px 0;
            font-size: 22px;
            letter-spacing: 1px;
        }
        .invoice-meta p {
            margin: 2px 0;
            font-size: 13px;
        }
        .section {
            margin: 16px 0;
            display: flex;
            gap: 24px;
        }
        .box {
            flex: 1;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 12px;
        }
        .box h3 {
            margin: 0 0 8px 0;
            font-size: 14px;
            text-transform: uppercase;
            color: #6b7280;
            letter-spacing: 0.5px;
        }
        .box p {
            margin: 4px 0;
            font-size: 13px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }
        th, td {
            border-bottom: 1px solid #e5e7eb;
            padding: 8px 6px;
            font-size: 13px;
        }
        th {
            text-align: left;
            background: #f9fafb;
        }
        td.num, th.num {
            text-align: right;
        }
        .totals {
            margin-top: 16px;
            display: flex;
            justify-content: flex-end;
        }
        .totals table {
            width: auto;
            min-width: 260px;
        }
        .totals td {
            border: none;
            padding: 4px 0;
        }
        .totals tr.total td {
            font-weight: bold;
            border-top: 1px solid #e5e7eb;
            padding-top: 8px;
        }
        .notes {
            margin-top: 16px;
            font-size: 13px;
            color: #4b5563;
        }
        .status {
            margin-top: 8px;
            font-size: 13px;
            font-weight: bold;
        }
        .logo {
            max-height: 60px;
            margin-bottom: 8px;
            display: none;
        }
        .error {
            padding: 12px;
            background: #fee2e2;
            color: #991b1b;
            border-radius: 6px;
        }
    </style>
    <link rel="icon" href="/favicon.ico">
</head>
<body>
    <div class="page" id="invoiceRoot">
        <div class="controls no-print">
            <button class="btn" onclick="safeCloseInvoice()">Tutup</button>
            <button class="btn primary" onclick="window.print()">Cetak</button>
        </div>

        <div id="invoiceError" class="error" style="display:none;">Data invoice tidak ditemukan.</div>

        <div id="invoiceContent">
            <div class="header">
                <div class="store">
                    <img id="storeLogo" class="logo" alt="Logo">
                    <h1 id="storeName">Nama Toko</h1>
                    <p id="storeAddress"></p>
                    <p id="storePhone"></p>
                </div>
                <div class="invoice-meta">
                    <h2 id="invoiceTitle">INVOICE</h2>
                    <p><strong>No:</strong> <span id="invoiceNo"></span></p>
                    <p><strong>Tanggal:</strong> <span id="invoiceDate"></span></p>
                    <p><strong>Jatuh Tempo:</strong> <span id="invoiceDueDate"></span></p>
                </div>
            </div>

            <div class="section">
                <div class="box">
                    <h3>Pelanggan</h3>
                    <p id="customerName"></p>
                    <p id="customerPhone"></p>
                    <p id="customerAddress"></p>
                </div>
                <div class="box">
                    <h3>Info</h3>
                    <p><strong>Status:</strong> <span id="paymentStatus"></span></p>
                    <p><strong>Kasir:</strong> <span id="cashierName"></span></p>
                    <p><strong>Metode Bayar:</strong> <span id="paymentMethod"></span></p>
                </div>
            </div>

            <table>
                <thead>
                    <tr>
                        <th style="width:40px;">No</th>
                        <th>Item</th>
                        <th class="num" style="width:90px;">Qty</th>
                        <th class="num" style="width:140px;">Harga</th>
                        <th class="num" style="width:160px;">Subtotal</th>
                    </tr>
                </thead>
                <tbody id="invoiceItemsBody"></tbody>
            </table>

            <div class="totals">
                <table>
                    <tr><td>Subtotal</td><td class="num" id="subtotalValue"></td></tr>
                    <tr><td>Diskon</td><td class="num" id="discountValue"></td></tr>
                    <tr><td>Pajak</td><td class="num" id="taxValue"></td></tr>
                    <tr><td>Ongkir</td><td class="num" id="shippingValue"></td></tr>
                    <tr><td>Service</td><td class="num" id="serviceValue"></td></tr>
                    <tr class="total"><td>Total</td><td class="num" id="totalValue"></td></tr>
                </table>
            </div>

            <div class="notes">
                <div id="notesBlock"></div>
                <div class="status" id="statusBlock"></div>
            </div>
        </div>
    </div>

    <script>
        function safeCloseInvoice() {
            try {
                if (window.opener && !window.opener.closed) {
                    window.close();
                    return;
                }
            } catch (e) {}
            try {
                if (history.length > 1) {
                    history.back();
                    return;
                }
            } catch (e) {}
            window.location.href = '/admin.html';
        }

        function parsePayload() {
            const params = new URLSearchParams(window.location.search);
            const raw = params.get('data');
            if (!raw) return null;
            try {
                return JSON.parse(decodeURIComponent(raw));
            } catch (e) {
                return null;
            }
        }

        function formatMoney(value, currency) {
            const precision = currency && typeof currency.precision === 'number' ? currency.precision : 0;
            const symbol = currency && currency.symbol ? currency.symbol : 'Rp';
            const thousand = currency && currency.thousandSeparator ? currency.thousandSeparator : '.';
            const decimal = currency && currency.decimalSeparator ? currency.decimalSeparator : ',';
            const num = Number(value || 0);
            const fixed = num.toFixed(precision);
            const parts = fixed.split('.');
            let intPart = parts[0];
            const sign = intPart.startsWith('-') ? '-' : '';
            if (sign) intPart = intPart.slice(1);
            intPart = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, thousand);
            const frac = parts[1] ? decimal + parts[1] : '';
            return `${symbol} ${sign}${intPart}${frac}`;
        }

        function fillText(id, text, fallback = '-') {
            const el = document.getElementById(id);
            if (el) el.textContent = text && String(text).trim() ? text : fallback;
        }

        function renderInvoice(data) {
            if (!data) {
                document.getElementById('invoiceError').style.display = 'block';
                document.getElementById('invoiceContent').style.display = 'none';
                return;
            }
            const currency = data.currency || {};
            const store = data.store || {};
            fillText('storeName', store.name || 'POS System', 'POS System');
            fillText('storeAddress', store.address || '');
            fillText('storePhone', store.phone || '');
            const logoEl = document.getElementById('storeLogo');
            if (logoEl && store.logo) {
                logoEl.src = store.logo;
                logoEl.style.display = 'block';
            }

            fillText('invoiceTitle', (data.title || 'INVOICE').toUpperCase());
            fillText('invoiceNo', data.invoiceNo || '-');
            fillText('invoiceDate', data.date || '-');
            fillText('invoiceDueDate', data.dueDate || '-');

            const cust = data.customer || {};
            fillText('customerName', cust.name || '-');
            fillText('customerPhone', cust.phone || '');
            fillText('customerAddress', cust.address || '');
            fillText('paymentStatus', data.paymentStatus || '-');
            fillText('cashierName', data.cashier || '-');
            fillText('paymentMethod', data.paymentMethod || '-');

            const itemsBody = document.getElementById('invoiceItemsBody');
            const items = Array.isArray(data.items) ? data.items : [];
            itemsBody.innerHTML = items.map((it, idx) => {
                const name = it.name || '-';
                const note = it.note ? ` (${it.note})` : '';
                const qtyText = `${it.qty || 0}${it.unit ? ' ' + it.unit : ''}`;
                return `
                    <tr>
                        <td>${idx + 1}</td>
                        <td>${name}${note}</td>
                        <td class="num">${qtyText}</td>
                        <td class="num">${formatMoney(it.price || 0, currency)}</td>
                        <td class="num">${formatMoney(it.subtotal || 0, currency)}</td>
                    </tr>
                `;
            }).join('') || '<tr><td colspan="5" class="num">Tidak ada item</td></tr>';

            const subtotal = Number(data.subtotal || 0) || 0;
            const discount = Number(data.discount || 0) || 0;
            const tax = Number(data.tax || 0) || 0;
            const shipping = Number(data.shipping || 0) || 0;
            const service = Number(data.service || 0) || 0;
            const total = Number(data.total || 0) || Math.max(0, subtotal - discount + tax + shipping + service);

            fillText('subtotalValue', formatMoney(subtotal, currency));
            fillText('discountValue', formatMoney(discount, currency));
            fillText('taxValue', formatMoney(tax, currency));
            fillText('shippingValue', formatMoney(shipping, currency));
            fillText('serviceValue', formatMoney(service, currency));
            fillText('totalValue', formatMoney(total, currency));

            const notesBlock = document.getElementById('notesBlock');
            notesBlock.textContent = data.notes ? `Catatan: ${data.notes}` : '';
            const statusBlock = document.getElementById('statusBlock');
            statusBlock.textContent = data.paymentStatus ? `Status: ${data.paymentStatus}` : '';
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderInvoice(parsePayload());
        });
    </script>
</body>
</html>
